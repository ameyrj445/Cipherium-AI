name: Cipherium AI Continuous Integration

on:
  push:
    branches: [main, master, ui-ux, api-backend]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Test Suite (Pytest & Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
            pip install pytest>=8.0.0 httpx>=0.27.0
          fi

      - name: Run Pytest suite
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          SECRET_KEY: ci-test-secret-key-32-characters-minimum
          ENVIRONMENT: test
          PYTHONPATH: .
        run: |
          if [ -d tests ]; then
            python -m pytest -v --durations=10
          else
            echo "No backend tests found; skipping."
          fi

  frontend-check:
    name: Frontend Test, Lint & Production Build (Vitest & Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit & component test suite
        run: npm test --if-present

      - name: Run oxlint / linter
        run: npm run lint

      - name: Run Vite production build
        run: npm run build

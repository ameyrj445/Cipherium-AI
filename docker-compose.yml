services:
  db:
    image: postgres:16-alpine
    container_name: cipherium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cipherium_user
      POSTGRES_PASSWORD: cipherium_secure_pass
      POSTGRES_DB: cipherium_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipherium_user -d cipherium_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cipherium-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://cipherium_user:cipherium_secure_pass@db:5432/cipherium_db
      SECRET_KEY: cipherium-production-secret-key-replace-with-openssl-rand-hex-32
      ENVIRONMENT: production
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: cipherium-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
